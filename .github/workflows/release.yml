name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    name: Build the gem and publish the GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@95ef2b042f9d7a56d8268cba8559e2842e2ad01b # v1.321.0
        with:
          ruby-version: "4.0"
          bundler-cache: true
      - run: bundle exec rspec
      - name: Assert the tag matches the gem version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          gem_version="$(ruby -Ilib -rtebako_release/version -e 'print TebakoRelease::VERSION')"
          [ "$tag" = "$gem_version" ] || {
            echo "NAMED FAILURE: tag ${GITHUB_REF_NAME} does not match TebakoRelease::VERSION ${gem_version}"
            exit 1
          }
      - name: Build the gem + its trust-anchor sidecar
        run: |
          set -euo pipefail
          gem build tebako-release.gemspec
          gem_file="tebako-release-${GITHUB_REF_NAME#v}.gem"
          sha256sum "$gem_file" | sed 's/ \*/  /' > "$gem_file.sha256"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gem_file="tebako-release-${GITHUB_REF_NAME#v}.gem"
          gh release create "$GITHUB_REF_NAME" \
            --title "tebako-release ${GITHUB_REF_NAME}" \
            --notes "Factories pin this line via contract.yml (\`release_tooling: ${GITHUB_REF_NAME}\`) and consume the gem through their Gemfile's git-tag source." \
            "$gem_file" "$gem_file.sha256"
